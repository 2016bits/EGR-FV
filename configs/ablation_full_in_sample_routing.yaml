base: default.yaml

experiment:
  name: full_in_sample_routing
  mode: full_in_sample_routing

data:
  routing_path: data/HOVER/routed/train_routing_in_sample.jsonl

model:
  use_fusion: false

routing:
  estimation: checkpoint

checkpoints:
  remix: outputs/HOVER/checkpoints/full_in_sample_routing/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/checkpoints/full_in_sample_routing
  log_dir: outputs/HOVER/logs/full_in_sample_routing
  prediction_dir: outputs/HOVER/predictions/full_in_sample_routing

inference:
  branch: grounded

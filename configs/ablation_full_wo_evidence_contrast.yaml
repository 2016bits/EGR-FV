base: default.yaml

experiment:
  name: full_wo_evidence_contrast
  mode: full_wo_evidence_contrast

model:
  use_fusion: false

loss:
  use_grounded_dominant: true
  use_evidence_contrast: false
  lambda_contrast: 0.0

checkpoints:
  remix: outputs/HOVER/checkpoints/full_wo_evidence_contrast/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/checkpoints/full_wo_evidence_contrast
  log_dir: outputs/HOVER/logs/full_wo_evidence_contrast
  prediction_dir: outputs/HOVER/predictions/full_wo_evidence_contrast

inference:
  branch: grounded

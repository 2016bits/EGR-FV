base: default.yaml

experiment:
  name: full_wo_grounded_dominant
  mode: full_wo_grounded_dominant
  uniform_sample_weights: true

model:
  use_fusion: false

loss:
  use_grounded_dominant: false
  use_evidence_contrast: true

checkpoints:
  remix: outputs/HOVER/checkpoints/full_wo_grounded_dominant/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/checkpoints/full_wo_grounded_dominant
  log_dir: outputs/HOVER/logs/full_wo_grounded_dominant
  prediction_dir: outputs/HOVER/predictions/full_wo_grounded_dominant

inference:
  branch: grounded

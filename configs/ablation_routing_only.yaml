base: default.yaml

experiment:
  name: routing_only
  mode: routing_only

model:
  use_fusion: false

loss:
  use_grounded_dominant: true
  use_evidence_contrast: false
  lambda_shortcut: 0.1
  lambda_orth: 0.0

checkpoints:
  remix: outputs/HOVER/checkpoints/routing_only/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/checkpoints/routing_only
  log_dir: outputs/HOVER/logs/routing_only
  prediction_dir: outputs/HOVER/predictions/routing_only

inference:
  branch: grounded

base: default.yaml

experiment:
  name: two_branches_joint
  mode: two_branch_only
  uniform_sample_weights: true

model:
  use_fusion: false

loss:
  use_grounded_dominant: false
  use_evidence_contrast: false
  lambda_shortcut: 0.1
  lambda_orth: 0.0

checkpoints:
  remix: outputs/HOVER/checkpoints/two_branches_joint/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/checkpoints/two_branches_joint
  log_dir: outputs/HOVER/logs/two_branches_joint
  prediction_dir: outputs/HOVER/predictions/two_branches_joint

inference:
  branch: grounded

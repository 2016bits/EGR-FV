base: ../default.yaml

experiment:
  name: full_egr_fv_deberta_v3_hover

model:
  shortcut_encoder: microsoft/deberta-v3-base
  grounded_encoder: microsoft/deberta-v3-base

data:
  routing_path: data/HOVER/routed/train_routing_deberta_v3.jsonl

checkpoints:
  shortcut: outputs/HOVER/deberta_v3/checkpoints/shortcut_best.pt
  grounded: outputs/HOVER/deberta_v3/checkpoints/grounded_best.pt
  remix: outputs/HOVER/deberta_v3/checkpoints/remix_best.pt

outputs:
  checkpoint_dir: outputs/HOVER/deberta_v3/checkpoints
  log_dir: outputs/HOVER/deberta_v3/logs
  prediction_dir: outputs/HOVER/deberta_v3/predictions

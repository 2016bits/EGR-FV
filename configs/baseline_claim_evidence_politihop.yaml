base: politihop.yaml

experiment:
  name: baseline_claim_evidence_politihop
  mode: grounded_only

checkpoints:
  shortcut: ""
  grounded: outputs/PolitiHop/baselines/claim_evidence/checkpoints/grounded_best.pt
  remix: ""

outputs:
  checkpoint_dir: outputs/PolitiHop/baselines/claim_evidence/checkpoints
  log_dir: outputs/PolitiHop/baselines/claim_evidence/logs
  prediction_dir: outputs/PolitiHop/baselines/claim_evidence/predictions/politihop

inference:
  branch: grounded
  fusion_alpha: 0.5
  fusion_method: probability_average

evaluation:
  grouping: record

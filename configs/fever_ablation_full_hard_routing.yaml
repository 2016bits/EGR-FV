base: fever.yaml

experiment:
  name: full_hard_routing_fever
  mode: full_hard_routing

data:
  routing_path: data/FEVER/routed/train_routing_hard.jsonl

model:
  use_fusion: false

routing:
  weighting: hard

checkpoints:
  remix: outputs/FEVER/checkpoints/full_hard_routing/remix_best.pt

outputs:
  checkpoint_dir: outputs/FEVER/checkpoints/full_hard_routing
  log_dir: outputs/FEVER/logs/full_hard_routing
  prediction_dir: outputs/FEVER/predictions/full_hard_routing/fever

inference:
  branch: grounded

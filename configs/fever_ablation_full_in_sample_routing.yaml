base: fever.yaml

experiment:
  name: full_in_sample_routing_fever
  mode: full_in_sample_routing

data:
  routing_path: data/FEVER/routed/train_routing_in_sample.jsonl

model:
  use_fusion: false

routing:
  estimation: checkpoint

checkpoints:
  remix: outputs/FEVER/checkpoints/full_in_sample_routing/remix_best.pt

outputs:
  checkpoint_dir: outputs/FEVER/checkpoints/full_in_sample_routing
  log_dir: outputs/FEVER/logs/full_in_sample_routing
  prediction_dir: outputs/FEVER/predictions/full_in_sample_routing/fever

inference:
  branch: grounded

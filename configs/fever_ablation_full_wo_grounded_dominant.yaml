base: fever.yaml

experiment:
  name: full_wo_grounded_dominant_fever
  mode: full_wo_grounded_dominant
  uniform_sample_weights: true

model:
  use_fusion: false

loss:
  use_grounded_dominant: false
  use_evidence_contrast: true

checkpoints:
  remix: outputs/FEVER/checkpoints/full_wo_grounded_dominant/remix_best.pt

outputs:
  checkpoint_dir: outputs/FEVER/checkpoints/full_wo_grounded_dominant
  log_dir: outputs/FEVER/logs/full_wo_grounded_dominant
  prediction_dir: outputs/FEVER/predictions/full_wo_grounded_dominant/fever

inference:
  branch: grounded

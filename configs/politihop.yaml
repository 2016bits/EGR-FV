base: default.yaml

experiment:
  name: full_egr_fv_politihop
  mode: full

data:
  train_path: data/PolitiHop/converted_data/train.json
  val_path: data/PolitiHop/converted_data/dev.json
  test_path: data/PolitiHop/converted_data/test.json
  routing_path: data/PolitiHop/routed/train_routing.jsonl
  max_claim_len: 96
  max_evidence_len: 384
  max_seq_len: 512
  num_workers: 0
  evidence_placeholder: "[NO_EVIDENCE]"
  label_map:
    SUPPORTS: 0
    REFUTES: 1

checkpoints:
  shortcut: outputs/PolitiHop/checkpoints/shortcut_best.pt
  grounded: outputs/PolitiHop/checkpoints/grounded_best.pt
  remix: outputs/PolitiHop/checkpoints/remix_best.pt

outputs:
  checkpoint_dir: outputs/PolitiHop/checkpoints
  log_dir: outputs/PolitiHop/logs
  prediction_dir: outputs/PolitiHop/predictions

training:
  epochs: 5
  batch_size: 16
  lr: 2e-5
